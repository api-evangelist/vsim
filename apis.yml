name: Vsim
description: 'Vsim (Vsim Technology Ltd) is a Manchester, UK physics-simulation startup
  founded in 2022 by ex-NVIDIA simulation engineers Michelle Lu (CEO) and Kier Storey
  (CTO). The company builds a next-generation physics simulation platform and an
  end-to-end reinforcement-learning training framework for robotics, reporting up
  to 100x training performance speed-ups over existing solutions, with applications
  across robotics, AI, visual effects, aerodynamics, gaming, and e-commerce. Vsim
  raised a $21.5M seed round led by EQT Ventures (total ~$24M). It does not currently
  publish a public API or developer program.'
